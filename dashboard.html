<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060a;
    --panel: rgba(10, 22, 32, 0.5);
    --panel-border: rgba(90, 210, 255, 0.25);
    --line: rgba(90, 210, 255, 0.35);
    --line-bright: rgba(140, 230, 255, 0.95);
    --cyan: #7fe8ff;
    --cyan-dim: #3aa3bd;
    --text: #e3f7ff;
    --text-dim: #7fa8b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 700px at 50% 15%, rgba(30,80,110,0.35) 0%, rgba(3,6,10,0) 60%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, rgba(20,60,85,0.25) 0%, rgba(3,6,10,0) 65%),
      repeating-linear-gradient(0deg, rgba(90,210,255,0.035) 0px, rgba(90,210,255,0.035) 1px, transparent 1px, transparent 44px),
      repeating-linear-gradient(90deg, rgba(90,210,255,0.035) 0px, rgba(90,210,255,0.035) 1px, transparent 1px, transparent 44px),
      var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }
  html::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg, rgba(180,240,255,0.02) 0px, rgba(180,240,255,0.02) 1px, transparent 1px, transparent 3px);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 70px;
    gap: 28px;
    position: relative;
  }

  .ring-wrap { position: relative; width: 340px; height: 340px; filter: drop-shadow(0 0 30px rgba(111,227,255,0.15)); }
  .ring-wrap svg { width: 100%; height: 100%; }
  .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .ring-bright { fill: none; stroke: var(--cyan); stroke-width: 1.6; opacity: 0.9; }
  .ring-faint { fill: none; stroke: rgba(90,210,255,0.15); stroke-width: 0.6; }
  .spin-slow { animation: spin 50s linear infinite; transform-origin: 170px 170px; }
  .spin-slow-rev { animation: spin 34s linear infinite reverse; transform-origin: 170px 170px; }
  .spin-med { animation: spin 20s linear infinite; transform-origin: 170px 170px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .orbit-dot { fill: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  .jarvis-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 24px; font-weight: 500; letter-spacing: 6px;
    color: var(--text); text-shadow: 0 0 20px rgba(111,227,255,0.85), 0 0 44px rgba(111,227,255,0.3);
    white-space: nowrap;
  }

  .clock {
    font-family: 'Orbitron', sans-serif;
    font-size: 52px; font-weight: 500; letter-spacing: 3px;
    text-shadow: 0 0 24px rgba(111,227,255,0.55), 0 0 60px rgba(111,227,255,0.2);
    text-align: center;
  }
  .date { font-size: 13px; letter-spacing: 4px; color: var(--cyan-dim); text-transform: uppercase; text-align: center; margin-top: 6px; font-weight: 600; }

  .panel {
    width: 100%; max-width: 560px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 16px; height: 16px;
    border: 1.5px solid var(--cyan); opacity: 0.6;
  }
  .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
  .label { font-size: 10.5px; letter-spacing: 3px; color: var(--cyan-dim); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 11px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: rgba(6,14,20,0.7); color: var(--text); font-size: 14px;
    font-family: 'Rajdhani', sans-serif;
  }
  input:focus { outline: none; border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(111,227,255,0.12); }
  small.note { color: var(--text-dim); display: block; margin-top: 7px; font-size: 12px; }

  button {
    border: none; border-radius: 7px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
  }
  #micBtn.listening { background: #ff5b5b; animation: pulseBtn 1.2s infinite; }
  @keyframes pulseBtn { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

  #status { color: var(--text-dim); font-size: 13.5px; margin-top: 10px; text-align: center; letter-spacing: 0.5px; }

  #log { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
  .msg { padding: 10px 13px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
  .msg.user { background: rgba(35,39,51,0.7); align-self: flex-end; max-width: 80%; margin-left: auto; }
  .msg.jarvis { background: rgba(16,32,44,0.7); border: 1px solid rgba(31,58,82,0.7); max-width: 90%; }
  .hud-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: -6px; }
  .hud-widget {
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .waveform-bars { display: flex; align-items: flex-end; gap: 2.5px; height: 26px; }
  .waveform-bars span {
    width: 3px; background: var(--cyan); border-radius: 2px;
    box-shadow: 0 0 4px var(--cyan);
    animation: wave 1.1s ease-in-out infinite;
  }
  @keyframes wave { 0%,100% { height: 20%; } 50% { height: 100%; } }
  .gauge-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; }
</style>
</head>
<body>

  <button id="screenShareBtn" style="position:fixed; top:16px; right:16px; z-index:50; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--panel-border); color:var(--text-dim); font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; font-family:'Rajdhani',sans-serif;">📺 Share Screen</button>
  <button id="muteBtn" onclick="toggleMute()" style="position:fixed; top:16px; right:150px; z-index:50; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--panel-border); color:var(--text-dim); font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; font-family:'Rajdhani',sans-serif;">🔊 Sound On</button>
  <button id="settingsBtn" onclick="openSettings()" style="position:fixed; top:16px; right:284px; z-index:50; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--panel-border); color:var(--text-dim); font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; font-family:'Rajdhani',sans-serif;">⚙️ Settings</button>

  <div id="settingsModal" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(3,6,10,0.85); align-items:center; justify-content:center;">
    <div style="background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--panel-border); border-radius:12px; padding:24px; max-width:420px; width:90%; font-family:'Rajdhani',sans-serif; color:var(--text);">
      <div style="font-family:'Orbitron',sans-serif; font-size:15px; letter-spacing:2px; margin-bottom:16px;">SETTINGS</div>
      <div id="settingsKeyList" style="font-size:13px; line-height:2; margin-bottom:16px;"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button onclick="clearAllKeys()" style="background:transparent; border:1px solid var(--panel-border); color:var(--text-dim); padding:8px 14px; border-radius:6px; font-size:12px;">Clear all saved keys</button>
        <button onclick="exportData()" style="background:transparent; border:1px solid var(--panel-border); color:var(--text-dim); padding:8px 14px; border-radius:6px; font-size:12px;">Export my data</button>
        <button onclick="closeSettings()" style="background:var(--cyan); border:none; color:#03060a; padding:8px 14px; border-radius:6px; font-size:12px; font-weight:600;">Close</button>
      </div>
    </div>
  </div>
  <video id="screenVideo" autoplay style="display:none;"></video>
  <canvas id="screenCanvas" style="display:none;"></canvas>

  <div class="hud-row">
    <div class="hud-widget">
      <div class="waveform-bars">
        <span style="animation-delay:0s"></span>
        <span style="animation-delay:0.1s"></span>
        <span style="animation-delay:0.2s"></span>
        <span style="animation-delay:0.3s"></span>
        <span style="animation-delay:0.15s"></span>
        <span style="animation-delay:0.25s"></span>
        <span style="animation-delay:0.05s"></span>
      </div>
      <span class="gauge-label">Audio</span>
    </div>
    <div class="hud-widget">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="14" fill="none" stroke="rgba(90,210,255,0.2)" stroke-width="2.5"/>
        <circle cx="17" cy="17" r="14" fill="none" stroke="var(--cyan)" stroke-width="2.5"
                stroke-dasharray="62 88" stroke-linecap="round" transform="rotate(-90 17 17)"/>
      </svg>
      <span class="gauge-label">System</span>
    </div>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 340 340">
      <g class="spin-slow">
        <circle class="ring" cx="170" cy="170" r="160"/>
        <circle class="ring" cx="170" cy="170" r="160" stroke-dasharray="4 12"/>
      </g>
      <g class="spin-slow-rev">
        <circle class="ring-bright" cx="170" cy="170" r="128" stroke-dasharray="2 7"/>
      </g>
      <g class="spin-med">
        <circle class="ring-faint" cx="170" cy="170" r="140"/>
        <circle class="orbit-dot" cx="170" cy="30" r="3.5"/>
      </g>
      <circle class="ring" cx="170" cy="170" r="95"/>
      <g stroke="rgba(127,232,255,0.4)" stroke-width="1">
        <line x1="170" y1="6" x2="170" y2="20"/>
        <line x1="170" y1="320" x2="170" y2="334"/>
        <line x1="6" y1="170" x2="20" y2="170"/>
        <line x1="320" y1="170" x2="334" y2="170"/>
      </g>
    </svg>
    <div class="jarvis-label">J A R V I S</div>
  </div>

  <div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="dateStr">LOADING</div>
  </div>

<script src="reminders.js"></script>
<script>
// ---------- Clock ----------
function pad(n){ return n.toString().padStart(2,'0'); }
function tick(){
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').textContent = h+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' '+ampm;
  document.getElementById('dateStr').textContent = now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
}
tick(); setInterval(tick, 1000);

// ---------- UI helpers ----------
// ---------- Key storage (no visible fields anymore — asks once, remembers locally) ----------
function getStoredKey(name, label, urlHint) {
  let val = localStorage.getItem(name);
  if (!val) {
    val = window.prompt(`Enter your ${label}\n(${urlHint})`, '');
    if (val) localStorage.setItem(name, val.trim());
  }
  return (val || '').trim();
}
function getGroqKey() { return getStoredKey('jarvis_groq_key', 'free Groq API key', 'get one at console.groq.com/keys'); }
function getFinnhubKey() { return localStorage.getItem('jarvis_finnhub_key') || ''; }
function setStatus(text) { const el = document.getElementById('statusText'); if (el) el.textContent = text; }

// ---------- Shared error helper — turns raw fetch failures into clear,
// specific spoken explanations instead of generic "something went wrong". ----------
function friendlyNetworkError(context, err, res, data) {
  if (!navigator.onLine) return `I can't reach the internet right now — check your connection and try again.`;
  if (res && (res.status === 401 || res.status === 403)) return `${context}: that API key looks invalid or expired — double check it.`;
  if (res && res.status === 429) return `${context}: too many requests right now — try again in a bit.`;
  if (res && !res.ok) return `${context}: ${data && data.error ? (data.error.message || data.error) : res.statusText}`;
  if (err) return `${context}: ${err.message}`;
  return `${context}: something unexpected happened.`;
}

// ---------- UI helpers (log panel removed — this just no-ops so callers don't break) ----------
function addMessage(who, text){ /* intentionally empty — log UI was removed */ }
const IDLE_TEXT_FALLBACK = 'Say "Hey Jarvis" to give a command.';
// ---------- Voice selection ----------
// Not a clone of any specific performer's voice (that's not something we can
// do) — just picks the smoothest-sounding male voice available in this
// browser and tunes pitch/rate for a calmer, more measured delivery.
let chosenVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const prefer = [
    v => /en-GB/i.test(v.lang) && /male/i.test(v.name),
    v => /en-GB/i.test(v.lang),
    v => /Daniel|Arthur|Oliver|George/i.test(v.name),
    v => /en-US/i.test(v.lang) && /male/i.test(v.name),
    v => /en/i.test(v.lang)
  ];
  for (const test of prefer) {
    const match = voices.find(test);
    if (match) { chosenVoice = match; return; }
  }
  chosenVoice = voices[0];
}
pickVoice();
if ('onvoiceschanged' in window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

let isMuted = localStorage.getItem('jarvis_muted') === 'true';
function toggleMute() {
  isMuted = !isMuted;
  localStorage.setItem('jarvis_muted', isMuted);
  const btn = document.getElementById('muteBtn');
  if (btn) btn.textContent = isMuted ? '🔇 Muted' : '🔊 Sound On';
  if (isMuted) window.speechSynthesis.cancel();
}

function speak(text){
  if (isMuted) return;
  const u = new SpeechSynthesisUtterance(text);
  if (chosenVoice) u.voice = chosenVoice;
  u.rate = 0.96;
  u.pitch = 0.85;
  window.speechSynthesis.speak(u);
}

// ---------- Settings modal ----------
function openSettings() {
  const list = document.getElementById('settingsKeyList');
  const keys = [
    ['jarvis_groq_key', 'Groq (brain)'],
    ['jarvis_finnhub_key', 'Finnhub (stocks)'],
    ['jarvis_news_key', 'GNews (headlines)']
  ];
  list.innerHTML = keys.map(([storageKey, label]) => {
    const present = !!localStorage.getItem(storageKey);
    return `<div>${label}: ${present ? '✅ saved' : '— not set'}</div>`;
  }).join('');
  document.getElementById('settingsModal').style.display = 'flex';
}
function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}
function clearAllKeys() {
  ['jarvis_groq_key', 'jarvis_finnhub_key', 'jarvis_news_key'].forEach(k => localStorage.removeItem(k));
  openSettings(); // refresh the display
}
function exportData() {
  const notes = getNotes();
  const list = getList();
  const habits = getHabitsRaw();
  const contacts = getContacts();
  let out = `JARVIS DATA EXPORT — ${new Date().toLocaleString()}\n\n`;
  out += `TO-DO LIST\n${list.length ? list.join('\n') : '(empty)'}\n\n`;
  out += `NOTES\n${notes.length ? notes.map(n => `[${new Date(n.when).toLocaleString()}] ${n.text}`).join('\n') : '(empty)'}\n\n`;
  out += `ROUTINE (${habits.date})\n${habits.items.length ? habits.items.map(i => `${i.name}: ${i.done ? 'done' : 'not done'}`).join('\n') : '(empty)'}\n\n`;
  const contactEntries = Object.values(contacts);
  out += `SAVED NOTES ABOUT PEOPLE\n${contactEntries.length ? contactEntries.map(c => `${c.name}: ${c.note}`).join('\n') : '(empty)'}\n`;

  const blob = new Blob([out], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `jarvis-data-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- App-opening ----------
// A few known aliases where the obvious domain guess would be wrong
// (e.g. "email" isn't a .com by itself).
const APP_ALIASES = {
  "gmail": "https://mail.google.com", "email": "https://mail.google.com",
  "calendar": "https://calendar.google.com", "spotify": "https://open.spotify.com",
  "drive": "https://drive.google.com", "docs": "https://docs.google.com",
  "sheets": "https://sheets.google.com", "maps": "https://maps.google.com",
  "twitter": "https://x.com", "x": "https://x.com"
};

function openApp(appName){
  const raw = appName.trim().toLowerCase();
  if (APP_ALIASES[raw]) {
    window.open(APP_ALIASES[raw], '_blank');
    return `Opening ${appName}.`;
  }
  // Best-effort guess: strip spaces/punctuation and try it as a .com domain.
  // Not perfect for every site, but covers the vast majority of common ones
  // ("reddit" -> reddit.com, "github" -> github.com, "notion" -> notion.so-ish).
  const slug = raw.replace(/[^a-z0-9.]/g, '');
  if (!slug) return `I didn't catch a site name to open.`;
  const url = slug.includes('.') ? `https://${slug}` : `https://www.${slug}.com`;
  window.open(url, '_blank');
  return `Opening ${appName} — if that's the wrong site, just tell me and I'll try again.`;
}

// ---------- Stocks ----------
// Common company-name -> ticker shortcuts, so "Hey Jarvis, what's Apple at"
// works without the user needing to know the ticker symbol.
const TICKER_ALIASES = {
  apple: "AAPL", google: "GOOGL", alphabet: "GOOGL", microsoft: "MSFT",
  amazon: "AMZN", tesla: "TSLA", meta: "META", facebook: "META",
  netflix: "NFLX", nvidia: "NVDA", anthropic: "N/A"
};
async function getStockPrice(symbolOrName) {
  const key = getFinnhubKey();
  if (!key) return "I need a free Finnhub API key for stock lookups — paste one into the Setup panel (finnhub.io/register).";
  const cleaned = symbolOrName.trim().toLowerCase();
  const symbol = (TICKER_ALIASES[cleaned] || symbolOrName.trim().toUpperCase());
  if (symbol === "N/A") return "That company isn't publicly traded.";
  try {
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${key}`);
    const data = await res.json();
    if (!res.ok) return friendlyNetworkError("Stock lookup", null, res, data);
    if (!data || data.c === undefined || data.c === 0) return `I couldn't find a price for "${symbolOrName}".`;
    const change = data.d;
    const pct = data.dp;
    const direction = change >= 0 ? "up" : "down";
    return `${symbol} is at $${data.c.toFixed(2)}, ${direction} ${Math.abs(change).toFixed(2)} (${Math.abs(pct).toFixed(2)}%) today.`;
  } catch (e) {
    return friendlyNetworkError("Stock lookup", e);
  }
}

// ---------- Location (shared by weather + prayer times) ----------
function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("no geolocation")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { timeout: 8000 }
    );
  });
}

// ---------- Weather (Open-Meteo — free, no key needed) ----------
const WEATHER_CODES = {
  0: "clear sky", 1: "mostly clear", 2: "partly cloudy", 3: "overcast",
  45: "foggy", 48: "foggy", 51: "light drizzle", 53: "drizzle", 55: "heavy drizzle",
  61: "light rain", 63: "rain", 65: "heavy rain", 71: "light snow", 73: "snow", 75: "heavy snow",
  80: "rain showers", 81: "rain showers", 82: "violent rain showers",
  95: "thunderstorms", 96: "thunderstorms with hail", 99: "thunderstorms with heavy hail"
};
async function getWeather() {
  let loc;
  try {
    loc = await getLocation();
  } catch (e) {
    return "I couldn't get your location for the weather — make sure location access is allowed for this site.";
  }
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit`);
    const data = await res.json();
    if (!res.ok) return friendlyNetworkError("Weather", null, res, data);
    const c = data.current;
    const desc = WEATHER_CODES[c.weather_code] || "unclear conditions";
    return `It's currently ${Math.round(c.temperature_2m)}°F with ${desc}, wind at ${Math.round(c.wind_speed_10m)} mph.`;
  } catch (e) {
    return friendlyNetworkError("Weather", e);
  }
}

// ---------- Prayer times (Aladhan API — free, no key needed) ----------
async function getPrayerTimes() {
  try {
    const loc = await getLocation();
    const today = new Date();
    const dateStr = `${pad(today.getDate())}-${pad(today.getMonth()+1)}-${today.getFullYear()}`;
    const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${loc.lat}&longitude=${loc.lon}&method=2`);
    const data = await res.json();
    const t = data.data.timings;
    return `Today's prayer times: Fajr ${t.Fajr}, Dhuhr ${t.Dhuhr}, Asr ${t.Asr}, Maghrib ${t.Maghrib}, Isha ${t.Isha}.`;
  } catch (e) {
    return "I couldn't get your location for prayer times — make sure location access is allowed for this site.";
  }
}

// ---------- Timer ----------
function setTimer(minutes, label) {
  const mins = parseFloat(minutes);
  if (isNaN(mins) || mins <= 0) return "I didn't catch a valid timer length.";
  const ms = mins * 60000;
  setTimeout(() => {
    const msg = label ? `Timer done: ${label}.` : `Your ${mins}-minute timer is up.`;
    addMessage('Jarvis', msg);
    speak(msg);
  }, ms);
  return `Timer set for ${mins} minute${mins === 1 ? '' : 's'}${label ? ` (${label})` : ''}.`;
}

// ---------- News headlines (GNews — free tier, needs a free key) ----------
function getNewsKey() { return getStoredKey('jarvis_news_key', 'free GNews API key', 'get one at gnews.io/register'); }
async function getNews(topic) {

  if (!key) return "I need a free GNews API key for headlines — you'll be asked for it once.";
  try {
    const q = topic ? `&q=${encodeURIComponent(topic)}` : '';

      ? `https://gnews.io/api/v4/search?token=${key}&lang=en&max=5${q}`
      : `https://gnews.io/api/v4/top-headlines?token=${key}&lang=en&max=5`;

  }
}

// ---------- Calculator / unit conversions ----------
const UNIT_CONVERSIONS = {
  "cups_to_liters": v => v * 0.236588, "liters_to_cups": v => v / 0.236588,
  "miles_to_km": v => v * 1.60934, "km_to_miles": v => v / 1.60934,
  "lbs_to_kg": v => v * 0.453592, "kg_to_lbs": v => v / 0.453592,
  "fahrenheit_to_celsius": v => (v - 32) * 5/9, "celsius_to_fahrenheit": v => v * 9/5 + 32,
  "feet_to_meters": v => v * 0.3048, "meters_to_feet": v => v / 0.3048,
  "gallons_to_liters": v => v * 3.78541, "liters_to_gallons": v => v / 3.78541,
  "oz_to_grams": v => v * 28.3495, "grams_to_oz": v => v / 28.3495
};
function calculate(expression) {
  try {
    // Only allow digits, operators, parens, decimal points, and whitespace —
    // never eval arbitrary text.
    if (!/^[\d\s+\-*/().]+$/.test(expression)) return "I can only do straightforward math expressions.";
    const result = Function(`"use strict"; return (${expression})`)();
    return `${expression} = ${result}`;
  } catch (e) {
    return "I couldn't calculate that.";
  }
}
function convertUnit(value, conversionKey) {
  const fn = UNIT_CONVERSIONS[conversionKey];
  if (!fn) return `I don't know that conversion. Known: ${Object.keys(UNIT_CONVERSIONS).join(', ')}.`;
  const result = fn(parseFloat(value));
  return `${value} → ${result.toFixed(3)}`;
}

// ---------- Currency conversion (open.er-api.com — free, no key needed) ----------
async function convertCurrency(amount, fromCode, toCode) {
  try {
    const from = fromCode.trim().toUpperCase();
    const to = toCode.trim().toUpperCase();
    const res = await fetch(`https://open.er-api.com/v6/latest/${from}`);
    const data = await res.json();
    if (!res.ok || data.result !== "success") return friendlyNetworkError("Currency conversion", null, res, data);
    const rate = data.rates[to];
    if (!rate) return `I don't have a rate for "${toCode}".`;
    const converted = parseFloat(amount) * rate;
    return `${amount} ${from} = ${converted.toFixed(2)} ${to}.`;
  } catch (e) {
    return friendlyNetworkError("Currency conversion", e);
  }
}

// ---------- Habit / routine checklist (resets automatically each day) ----------
function getHabitsRaw() {
  try { return JSON.parse(localStorage.getItem('jarvis_habits') || '{"date":"","items":[]}'); }
  catch (e) { return { date: "", items: [] }; }
}
function getHabits() {
  const data = getHabitsRaw();
  const today = new Date().toDateString();
  if (data.date !== today) {
    // New day — reset every habit's "done" flag but keep the habit names.
    data.date = today;
    data.items = data.items.map(i => ({ name: i.name, done: false }));
    localStorage.setItem('jarvis_habits', JSON.stringify(data));
  }
  return data;

  if (data.items.some(i => i.name.toLowerCase() === name.toLowerCase())) return `"${name}" is already on your routine.`;

  localStorage.setItem('jarvis_habits', JSON.stringify(data));
  return `Added "${name}" to your daily routine.`;
}
function checkOffHabit(name) {
  const data = getHabits();
  const item = data.items.find(i => i.name.toLowerCase().includes(name.toLowerCase()));

async function callJarvis(userText) {
  const apiKey = getGroqKey();
  if (!apiKey) { addMessage('Jarvis', 'Please paste your free Groq API key above first.'); return; }

  conversation.push({ role: "user", content: userText });
  setStatus("Thinking...");

  try {
    let res = await fetchGroq(apiKey, conversation);
    let data = await res.json();
    if (!res.ok) { addMessage('Jarvis', `Error: ${data.error ? data.error.message : res.statusText}`); setStatus(IDLE_TEXT_FALLBACK); return; }

    let message = data.choices[0].message;
    conversation.push(message);

    if (message.content && message.content.trim()) { addMessage('Jarvis', message.content.trim()); speak(message.content.trim()); }

    if (message.tool_calls && message.tool_calls.length) {
      for (const call of message.tool_calls) {
        const resultText = await runTool(call);
        addMessage('Jarvis', resultText);
        speak(resultText);
        conversation.push({ role: "tool", tool_call_id: call.id, content: resultText });
      }
      setStatus("Thinking...");
      res = await fetchGroq(apiKey, conversation);
      data = await res.json();
      if (res.ok) {
        message = data.choices[0].message;
        conversation.push(message);
        if (message.content && message.content.trim()) { addMessage('Jarvis', message.content.trim()); speak(message.content.trim()); }
      }
    }
  } catch (e) { addMessage('Jarvis', `Something went wrong: ${e.message}`); }

  setStatus(IDLE_TEXT_FALLBACK);
}

// ---------- Speech recognition ----------
let recognizing = false, recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  // listenDot element removed from UI; guarded below so nothing throws
  // statusText element removed from UI; setStatus() helper handles this safely now
  let micEnabled = false;
  let paused = false; // true while Jarvis is thinking or speaking, so it doesn't hear itself
  const WAKE_WORD = "hey jarvis";
  const IDLE_TEXT = `Say "Hey Jarvis" to give a command.`;

  // Prevents the common "recognition has already started" error, which
  // silently breaks the auto-restart loop if two starts overlap.
  function safeStart() {
    if (recognizing || paused || !micEnabled) return;
    try { recognition.start(); } catch (e) { /* already starting, ignore */ }
  }

  function extractCommand(transcript) {
    const lower = transcript.toLowerCase();
    const idx = lower.indexOf(WAKE_WORD);
    if (idx === -1) return null;
    let rest = transcript.slice(idx + WAKE_WORD.length).trim();
    rest = rest.replace(/^[,:\-]\s*/, '');
    return rest;
  }

  recognition.onstart = () => {
    recognizing = true;
    const dotEl1 = document.getElementById('listenDot'); if (dotEl1) { dotEl1.style.background = '#ff5b5b'; dotEl1.style.boxShadow = '0 0 8px #ff5b5b'; }
    setStatus("Listening...");
  };

  recognition.onend = () => {
    recognizing = false;
    const dotEl2 = document.getElementById('listenDot'); if (dotEl2) { dotEl2.style.background = 'var(--cyan)'; dotEl2.style.boxShadow = '0 0 8px var(--cyan)'; }
    setTimeout(safeStart, 250);
  };

  recognition.onerror = (e) => {
    recognizing = false;
    if (e.error === 'no-speech' || e.error === 'aborted') return; // normal, just restart
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setStatus("Mic permission blocked — check the site's permissions in Chrome (padlock icon in the address bar) and allow microphone access.");
      return;
    }
    setStatus(`Mic error: ${e.error} — retrying...`);
    setTimeout(safeStart, 800);
  };

  let followUpActive = false;
  let followUpTimeout = null;
  const FOLLOW_UP_WINDOW_MS = 7000;

  function startFollowUpWindow() {
    followUpActive = true;
    clearTimeout(followUpTimeout);
    followUpTimeout = setTimeout(() => { followUpActive = false; }, FOLLOW_UP_WINDOW_MS);
  }

  recognition.onresult = async (event) => {
    const t = event.results[0][0].transcript;
    let command;

    if (followUpActive) {
      // Within a few seconds of the last response, skip the wake-word
      // requirement so follow-ups feel like a natural conversation.
      command = t.trim();
    } else {
      command = extractCommand(t);
      if (command === null) {
        // Wake word wasn't heard and we're not in a follow-up window — ignore.
        return;
      }
    }

    if (!command) {
      // They said just "Hey Jarvis" with nothing after it.
      addMessage('You', 'Hey Jarvis');
      addMessage('Jarvis', 'Yes?');
      speak('Yes?');
      startFollowUpWindow();
      return;
    }

    clearTimeout(followUpTimeout);
    followUpActive = false;
    addMessage('You', t);
    paused = true;
    setStatus("Thinking...");
    await callJarvis(command);
    paused = false;
    setStatus(IDLE_TEXT);
    safeStart();
    startFollowUpWindow();
  };

  function enableMic() {
    grantMicAndStart();
    const overlay = document.getElementById('enableOverlay');
    if (overlay) overlay.remove();
  }

  // getUserMedia's permission grant is remembered far more reliably by Chrome
  // than repeatedly calling recognition.start() cold, which was causing the
  // native "Allow microphone" bar to reappear on every restart. Ask once here,
  // then let the recognizer run freely afterward.
  function grantMicAndStart() {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then((stream) => {
        stream.getTracks().forEach(t => t.stop()); // we only needed the permission grant
        micEnabled = true;
        safeStart();
      })
      .catch(() => {
        setStatus("Mic permission was blocked — check the site's permissions (padlock icon in the address bar) and allow microphone access, then reload.");
      });
  }

  // Try to get permission automatically; if the browser blocks it (no user
  // gesture yet), show a one-time full-page tap overlay to grant it.
  try {
    grantMicAndStart();
  } catch (e) {
    const overlay = document.createElement('div');
    overlay.id = 'enableOverlay';
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(4,7,10,0.85); display:flex; align-items:center; justify-content:center; z-index:1000; color:var(--text); font-size:18px; letter-spacing:1px; cursor:pointer; text-align:center; padding:20px;';
    overlay.textContent = 'Tap anywhere to enable the microphone (one-time)';
    overlay.addEventListener('click', enableMic);
    document.body.appendChild(overlay);
  }

  setStatus(IDLE_TEXT);

  // Pause the mic while Jarvis is speaking so it doesn't transcribe itself,
  // then resume automatically once speech finishes.
  speak = function(text) {
    paused = true;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02;
    u.onend = () => { paused = false; safeStart(); };
    window.speechSynthesis.speak(u);
  };
} else {
  setStatus("Speech recognition isn't supported in this browser.");
}
</script>

</body>
</html>
