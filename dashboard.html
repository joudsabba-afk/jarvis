<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060a;
    --panel: rgba(10, 22, 32, 0.5);
    --panel-border: rgba(90, 210, 255, 0.25);
    --line: rgba(135, 206, 250, 0.55);
    --line-bright: rgba(180, 225, 255, 1);
    --cyan: #87ceff;
    --cyan-dim: #5fb0e8;
    --text: #e3f7ff;
    --text-dim: #7fa8b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 700px at 50% 15%, rgba(135,206,250,0.28) 0%, rgba(10,25,40,0) 60%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, rgba(100,180,235,0.22) 0%, rgba(10,25,40,0) 65%),
      repeating-linear-gradient(0deg, rgba(135,206,250,0.06) 0px, rgba(135,206,250,0.06) 1px, transparent 1px, transparent 44px),
      repeating-linear-gradient(90deg, rgba(135,206,250,0.06) 0px, rgba(135,206,250,0.06) 1px, transparent 1px, transparent 44px),
      var(--bg);
    background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px, 100% 100%;
    animation: bgBreathe 8s ease-in-out infinite;
    color: var(--text);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }
  html::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg, rgba(135,206,250,0.02) 0px, rgba(135,206,250,0.02) 1px, transparent 1px, transparent 3px);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 70px;
    gap: 28px;
    position: relative;
  }

  .ring-wrap { position: relative; width: 340px; height: 340px; filter: drop-shadow(0 0 50px rgba(135,206,250,0.5)); transition: transform 0.15s ease-out; }
  .ring-wrap.speaking { animation: bounce 0.5s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .ring-wrap svg { width: 100%; height: 100%; }
  .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .ring-bright { fill: none; stroke: var(--cyan); stroke-width: 1.6; opacity: 0.9; }
  .ring-faint { fill: none; stroke: rgba(90,210,255,0.15); stroke-width: 0.6; }
  .spin-slow { animation: spin 50s linear infinite; transform-origin: 170px 170px; }
  .spin-slow-rev { animation: spin 34s linear infinite reverse; transform-origin: 170px 170px; }
  .spin-med { animation: spin 20s linear infinite; transform-origin: 170px 170px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes bgBreathe {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }
  .orbit-dot { fill: var(--cyan); filter: drop-shadow(0 0 12px var(--cyan)); }
  .jarvis-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 24px; font-weight: 500; letter-spacing: 6px;
    color: var(--text); text-shadow: 0 0 26px rgba(135,206,250,1), 0 0 60px rgba(135,206,250,0.55);
    white-space: nowrap;
  }

  .clock {
    font-family: 'Orbitron', sans-serif;
    font-size: 52px; font-weight: 500; letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(135,206,250,0.8), 0 0 80px rgba(135,206,250,0.4);
    text-align: center;
  }
  .date { font-size: 13px; letter-spacing: 4px; color: var(--cyan-dim); text-transform: uppercase; text-align: center; margin-top: 6px; font-weight: 600; }

  .panel {
    width: 100%; max-width: 560px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 16px; height: 16px;
    border: 1.5px solid var(--cyan); opacity: 0.6;
  }
  .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
  .label { font-size: 10.5px; letter-spacing: 3px; color: var(--cyan-dim); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 11px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: rgba(6,14,20,0.7); color: var(--text); font-size: 14px;
    font-family: 'Rajdhani', sans-serif;
  }
  input:focus { outline: none; border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(135,206,250,0.3); }
  small.note { color: var(--text-dim); display: block; margin-top: 7px; font-size: 12px; }

  button {
    border: none; border-radius: 7px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
  }
  #micBtn.listening { background: #ff5b5b; animation: pulseBtn 1.2s infinite; }
  @keyframes pulseBtn { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

  #status { color: var(--text-dim); font-size: 13.5px; margin-top: 10px; text-align: center; letter-spacing: 0.5px; }

  #log { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
  .msg { padding: 10px 13px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
  .msg.user { background: rgba(35,39,51,0.7); align-self: flex-end; max-width: 80%; margin-left: auto; }
  .msg.jarvis { background: rgba(16,32,44,0.7); border: 1px solid rgba(31,58,82,0.7); max-width: 90%; }
  .hud-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: -6px; }
  .hud-widget {
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .waveform-bars { display: flex; align-items: flex-end; gap: 2.5px; height: 26px; }
  .waveform-bars span {
    width: 3px; background: var(--cyan); border-radius: 2px;
    box-shadow: 0 0 8px var(--cyan);
    animation: wave 1.1s ease-in-out infinite;
  }
  @keyframes wave { 0%,100% { height: 20%; } 50% { height: 100%; } }
  .gauge-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; }
</style>
</head>
<body>

<script>
// ---------- Clock ----------
function pad(n){ return n.toString().padStart(2,'0'); }
function tick(){
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').textContent = h+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' '+ampm;
  document.getElementById('dateStr').textContent = now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
}
tick(); setInterval(tick, 1000);

// ---------- UI helpers ----------
// ---------- Key storage (no visible fields anymore — asks once, remembers locally) ----------
function getStoredKey(name, label, urlHint) {
  let val = localStorage.getItem(name);
  if (!val) {
    val = window.prompt(`Enter your ${label}\n(${urlHint})`, '');
    if (val) localStorage.setItem(name, val.trim());
  }
  return (val || '').trim();
}
function getGroqKey() { return getStoredKey('jarvis_groq_key', 'free Groq API key', 'get one at console.groq.com/keys'); }
function getFinnhubKey() { return getStoredKey('jarvis_finnhub_key', 'free Finnhub API key (for stock prices)', 'get one at finnhub.io/register'); }
function setStatus(text) { const el = document.getElementById('statusText'); if (el) el.textContent = text; }

// ---------- Shared error helper — turns raw fetch failures into clear,
// specific spoken explanations instead of generic "something went wrong". ----------
function friendlyNetworkError(context, err, res, data) {
  if (!navigator.onLine) return `I can't reach the internet right now — check your connection and try again.`;
  if (res && (res.status === 401 || res.status === 403)) return `${context}: that API key looks invalid or expired — double check it.`;
  if (res && res.status === 429) return `${context}: too many requests right now — try again in a bit.`;
  if (res && !res.ok) return `${context}: ${data && data.error ? (data.error.message || data.error) : res.statusText}`;
  if (err) return `${context}: ${err.message}`;
  return `${context}: something unexpected happened.`;
}

// ---------- UI helpers (log panel removed — this just no-ops so callers don't break) ----------
function addMessage(who, text){ /* intentionally empty — log UI was removed */ }
const IDLE_TEXT_FALLBACK = 'Say "Hey Jarvis" to give a command.';
// ---------- Voice selection ----------
// Not a clone of any specific performer's voice (that's not something we can
// do) — just picks the smoothest-sounding male voice available in this
// browser and tunes pitch/rate for a calmer, more measured delivery.
let chosenVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const prefer = [
    v => /Google UK English Male/i.test(v.name),
    v => /en-GB/i.test(v.lang) && /male/i.test(v.name),
    v => /Daniel|Arthur|Oliver|George/i.test(v.name),
    v => /en-GB/i.test(v.lang),
    v => /en-US/i.test(v.lang) && /male/i.test(v.name),
    v => /en/i.test(v.lang)
  ];
  for (const test of prefer) {
    const match = voices.find(test);
    if (match) { chosenVoice = match; return; }
  }
  chosenVoice = voices[0];
}
pickVoice();
if ('onvoiceschanged' in window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

let isMuted = localStorage.getItem('jarvis_muted') === 'true';
function toggleMute() {
  isMuted = !isMuted;
  localStorage.setItem('jarvis_muted', isMuted);
  const btn = document.getElementById('muteBtn');
  if (btn) btn.textContent = isMuted ? '🔇 Muted' : '🔊 Sound On';
  if (isMuted) window.speechSynthesis.cancel();
}

function speak(text){
  if (isMuted) return;
  const u = new SpeechSynthesisUtterance(text);
  if (chosenVoice) u.voice = chosenVoice;
  u.rate = 1.08;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

// ---------- Settings modal ----------
function openSettings() {
  const list = document.getElementById('settingsKeyList');
  const keys = [
    ['jarvis_groq_key', 'Groq (brain)'],
    ['jarvis_finnhub_key', 'Finnhub (stocks)'],
    ['jarvis_news_key', 'GNews (headlines)']
  ];
  list.innerHTML = keys.map(([storageKey, label]) => {
    const present = !!localStorage.getItem(storageKey);
    return `<div>${label}: ${present ? '✅ saved' : '— not set'}</div>`;
  }).join('');
  document.getElementById('settingsModal').style.display = 'flex';
}
function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}
function clearAllKeys() {
  ['jarvis_groq_key', 'jarvis_finnhub_key', 'jarvis_news_key'].forEach(k => localStorage.removeItem(k));
  openSettings(); // refresh the display
}
function exportData() {
  const notes = getNotes();
  const list = getList();
  const habits = getHabitsRaw();
  const contacts = getContacts();
  let out = `JARVIS DATA EXPORT — ${new Date().toLocaleString()}\n\n`;
  out += `TO-DO LIST\n${list.length ? list.join('\n') : '(empty)'}\n\n`;
  out += `NOTES\n${notes.length ? notes.map(n => `[${new Date(n.when).toLocaleString()}] ${n.text}`).join('\n') : '(empty)'}\n\n`;
  out += `ROUTINE (${habits.date})\n${habits.items.length ? habits.items.map(i => `${i.name}: ${i.done ? 'done' : 'not done'}`).join('\n') : '(empty)'}\n\n`;
  const contactEntries = Object.values(contacts);
  out += `SAVED NOTES ABOUT PEOPLE\n${contactEntries.length ? contactEntries.map(c => `${c.name}: ${c.note}`).join('\n') : '(empty)'}\n`;

  const blob = new Blob([out], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `jarvis-data-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- App-opening ----------
// A few known aliases where the obvious domain guess would be wrong
// (e.g. "email" isn't a .com by itself).
const APP_ALIASES = {
  "gmail": "https://mail.google.com", "email": "https://mail.google.com",
  "calendar": "https://calendar.google.com", "spotify": "https://open.spotify.com",
  "drive": "https://drive.google.com", "docs": "https://docs.google.com",
  "sheets": "https://sheets.google.com", "maps": "https://maps.google.com",
  "twitter": "https://x.com", "x": "https://x.com"
};

function openApp(appName){
  const raw = appName.trim().toLowerCase();
  if (APP_ALIASES[raw]) {
    window.open(APP_ALIASES[raw], '_blank');
    return `Opening ${appName}.`;
  }
  // Best-effort guess: strip spaces/punctuation and try it as a .com domain.
  // Not perfect for every site, but covers the vast majority of common ones
  // ("reddit" -> reddit.com, "github" -> github.com, "notion" -> notion.so-ish).
  const slug = raw.replace(/[^a-z0-9.]/g, '');
  if (!slug) return `I didn't catch a site name to open.`;
  const url = slug.includes('.') ? `https://${slug}` : `https://www.${slug}.com`;
  window.open(url, '_blank');
  return `Opening ${appName} — if that's the wrong site, just tell me and I'll try again.`;
}

// ---------- Stocks ----------
// Common company-name -> ticker shortcuts, so "Hey Jarvis, what's Apple at"
// works without the user needing to know the ticker symbol.
const TICKER_ALIASES = {
  apple: "AAPL", google: "GOOGL", alphabet: "GOOGL", microsoft: "MSFT",
  amazon: "AMZN", tesla: "TSLA", meta: "META", facebook: "META",
  netflix: "NFLX", nvidia: "NVDA", anthropic: "N/A"
};
async function getStockPrice(symbolOrName) {
  const key = getFinnhubKey();
  if (!key) return "I need a free Finnhub API key for stock lookups — paste one into the Setup panel (finnhub.io/register).";
  const cleaned = symbolOrName.trim().toLowerCase();
  const symbol = (TICKER_ALIASES[cleaned] || symbolOrName.trim().toUpperCase());
  if (symbol === "N/A") return "That company isn't publicly traded.";
  try {
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${key}`);
    const data = await res.json();
    if (!res.ok) return friendlyNetworkError("Stock lookup", null, res, data);
    if (!data || data.c === undefined || data.c === 0) return `I couldn't find a price for "${symbolOrName}".`;

    return `${symbol} is at $${data.c.toFixed(2)}, ${direction} ${Math.abs(change).toFixed(2)} (${Math.abs(pct).toFixed(2)}%) today.`;
  } catch (e) {
    return friendlyNetworkError("Stock lookup", e);
  }
}

// ---------- Location (shared by weather + prayer times) ----------
function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("no geolocation")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { timeout: 8000 }
    );
  });
}

  61: "light rain", 63: "rain", 65: "heavy rain", 71: "light snow", 73: "snow", 75: "heavy snow",

function renderTimers() {

  container.innerHTML = activeTimers.map(t => {

  }).join('');
}
setInterval(renderTimers, 1000);

function setTimer(minutes, label) {
  const mins = parseFloat(minutes);
  if (isNaN(mins) || mins <= 0) return "I didn't catch a valid timer length.";
  const ms = mins * 60000;
  const id = Date.now() + Math.random();
  const endTime = Date.now() + ms;
  activeTimers.push({ id, label, endTime });
  renderTimers();
  setTimeout(() => {
    const msg = label ? `Timer done: ${label}.` : `Your ${mins}-minute timer is up.`;
    addMessage('Jarvis', msg);
    speak(msg);
    activeTimers = activeTimers.filter(t => t.id !== id);
    renderTimers();
  }, ms);
  return `Timer set for ${mins} minute${mins === 1 ? '' : 's'}${label ? ` (${label})` : ''}, sir.`;
}

// ---------- Calculator / unit conversions ----------
const UNIT_CONVERSIONS = {
  "cups_to_liters": v => v * 0.236588, "liters_to_cups": v => v / 0.236588,
  "miles_to_km": v => v * 1.60934, "km_to_miles": v => v / 1.60934,
  "lbs_to_kg": v => v * 0.453592, "kg_to_lbs": v => v / 0.453592,
  "fahrenheit_to_celsius": v => (v - 32) * 5/9, "celsius_to_fahrenheit": v => v * 9/5 + 32,
  "feet_to_meters": v => v * 0.3048, "meters_to_feet": v => v / 0.3048,
  "gallons_to_liters": v => v * 3.78541, "liters_to_gallons": v => v / 3.78541,
  "oz_to_grams": v => v * 28.3495, "grams_to_oz": v => v / 28.3495
};
function calculate(expression) {
  try {
    // Only allow digits, operators, parens, decimal points, and whitespace —
    // never eval arbitrary text.
    if (!/^[\d\s+\-*/().]+$/.test(expression)) return "I can only do straightforward math expressions.";
    const result = Function(`"use strict"; return (${expression})`)();
    return `${expression} = ${result}`;
  } catch (e) {
    return "I couldn't calculate that.";
  }
}
function convertUnit(value, conversionKey) {
  const fn = UNIT_CONVERSIONS[conversionKey];
  if (!fn) return `I don't know that conversion. Known: ${Object.keys(UNIT_CONVERSIONS).join(', ')}.`;
  const result = fn(parseFloat(value));
  return `${value} → ${result.toFixed(3)}`;
}

// ---------- Currency conversion (open.er-api.com — free, no key needed) ----------
async function convertCurrency(amount, fromCode, toCode) {
  try {
    const from = fromCode.trim().toUpperCase();
    const to = toCode.trim().toUpperCase();
    const res = await fetch(`https://open.er-api.com/v6/latest/${from}`);
    const data = await res.json();
    if (!res.ok || data.result !== "success") return friendlyNetworkError("Currency conversion", null, res, data);
    const rate = data.rates[to];
    if (!rate) return `I don't have a rate for "${toCode}".`;
    const converted = parseFloat(amount) * rate;
    return `${amount} ${from} = ${converted.toFixed(2)} ${to}.`;
  } catch (e) {
    return friendlyNetworkError("Currency conversion", e);
  }
}

// ---------- Day planning (plan tomorrow tonight, get reminded and asked
// back the next day, update it any time during the day) ----------
function dateKey(d) {
  if (!d) return dateKeyFromDate(new Date());
  const lower = String(d).trim().toLowerCase();
  if (lower === 'today') return dateKeyFromDate(new Date());
  if (lower === 'tomorrow') { const t = new Date(); t.setDate(t.getDate() + 1); return dateKeyFromDate(t); }
  const parsed = new Date(d);
  if (isNaN(parsed.getTime())) return dateKeyFromDate(new Date()); // fall back to today rather than crash
  return dateKeyFromDate(parsed);
}
function dateKeyFromDate(dt) {
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function getDayPlans() {
  try { return JSON.parse(localStorage.getItem('jarvis_day_plans') || '{}'); }
  catch (e) { return {}; }
}
function saveDayPlan(dateStr, plan) {
  const plans = getDayPlans();
  const key = dateKey(dateStr);
  plans[key] = plan;
  localStorage.setItem('jarvis_day_plans', JSON.stringify(plans));
  const label = key === dateKey() ? "today" : key;
  return `Plan saved for ${label}, sir: ${plan}`;
}
function readDayPlan(dateStr) {
  const plans = getDayPlans();
  const key = dateStr ? dateKey(dateStr) : dateKey();
  const plan = plans[key];
  const label = key === dateKey() ? "today" : key;
  if (!plan) return `You don't have a plan saved for ${label} yet.`;
  return `Your plan for ${label}: ${plan}`;
}

// Once per calendar day, if a plan exists for today and hasn't been spoken
// yet this session, announce it automatically right after startup.
function maybeAnnounceTodayPlan() {
  const todayKey = dateKey();
  const lastAnnounced = localStorage.getItem('jarvis_plan_announced_date');
  if (lastAnnounced === todayKey) return; // already told them today
  const plans = getDayPlans();
  const plan = plans[todayKey];
  if (!plan) return; // nothing planned, nothing to announce
  localStorage.setItem('jarvis_plan_announced_date', todayKey);
  setTimeout(() => {
    const msg = `Good day, sir. Here's your plan for today: ${plan}`;
    addMessage('Jarvis', msg);
    speak(msg);
  }, 2000); // brief delay so it doesn't collide with the startup tone
}

function writeDocument(title, content) {

  writtenDocs.unshift({ id, title, content });
  if (writtenDocs.length > 10) writtenDocs.pop(); // keep the most recent 10
  localStorage.setItem('jarvis_docs', JSON.stringify(writtenDocs));
  renderDocList();
  showDoc(id);

}

// ---------- Screen sharing / vision ----------
let screenStream = null;
const screenVideo = document.getElementById('screenVideo');
const screenCanvas = document.getElementById('screenCanvas');

// Browsers require a genuine click to start screen capture — there's no way
// to make this "always on" silently, since that's a deliberate privacy
// protection (a site secretly watching your screen would be a serious
// risk). This is called from the one-time "Tap to start JARVIS" screen, so
// it's bundled into that same single click instead of a separate button.
async function requestScreenShare() {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    screenVideo.srcObject = screenStream;
    screenStream.getVideoTracks()[0].addEventListener('ended', () => {
      screenStream = null;
    });
  } catch (e) {
    // user cancelled the share picker — look_at_screen will just report
    // that screen sharing isn't enabled if asked about it later.
  }
}

function captureScreenFrame() {
  screenCanvas.width = screenVideo.videoWidth;
  screenCanvas.height = screenVideo.videoHeight;
  const ctx = screenCanvas.getContext('2d');
  ctx.drawImage(screenVideo, 0, 0);
  return screenCanvas.toDataURL('image/jpeg', 0.7);
}

async function lookAtScreen(question) {
  if (!screenStream) return "Screen sharing isn't on yet — click the 'Share Screen' button in the top right first.";
  const apiKey = getGroqKey();
  try {
    const imageDataUrl = captureScreenFrame();
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: JSON.stringify({
        model: "qwen/qwen3.6-27b",
        max_tokens: 500,
        messages: [{
          role: "user",
          content: [
            { type: "text", text: question || "Describe what's currently on the screen." },
            { type: "image_url", image_url: { url: imageDataUrl } }
          ]
        }]
      })
    });
    const data = await res.json();
    if (!res.ok) return `Couldn't look at the screen: ${data.error ? data.error.message : res.statusText}`;
    return data.choices[0].message.content;
  } catch (e) {
    return `Couldn't look at the screen: ${e.message}`;
  }
}

  { type:"function", function:{ name:"look_at_screen", description:"Look at what's currently visible on the user's shared screen to answer a question about it. Only works if the user has enabled screen sharing.",
    parameters:{ type:"object", properties:{ question:{type:"string", description:"what to look for or answer about the screen"} }, required:["question"] } } },
  { type:"function", function:{ name:"add_to_list", description:"Add an item to the user's to-do/notes list.",
    parameters:{ type:"object", properties:{ item:{type:"string"} }, required:["item"] } } },
  { type:"function", function:{ name:"read_list", description:"Read back everything currently on the user's to-do/notes list.",
    parameters:{ type:"object", properties:{} } } },
  { type:"function", function:{ name:"remove_from_list", description:"Remove an item from the user's to-do/notes list by matching text.",
    parameters:{ type:"object", properties:{ item:{type:"string"} }, required:["item"] } } },
  { type:"function", function:{ name:"get_news", description:"Get current news headlines, optionally about a specific topic.",
    parameters:{ type:"object", properties:{ topic:{type:"string", description:"optional topic to search news for"} } } } },
  { type:"function", function:{ name:"calculate", description:"Evaluate a straightforward math expression, e.g. '12 * 8' or '(45 + 5) / 2'.",
    parameters:{ type:"object", properties:{ expression:{type:"string"} }, required:["expression"] } } },
  { type:"function", function:{ name:"convert_unit", description:"Convert a value between common units. conversion_key options: cups_to_liters, liters_to_cups, miles_to_km, km_to_miles, lbs_to_kg, kg_to_lbs, fahrenheit_to_celsius, celsius_to_fahrenheit, feet_to_meters, meters_to_feet, gallons_to_liters, liters_to_gallons, oz_to_grams, grams_to_oz.",
    parameters:{ type:"object", properties:{ value:{type:"number"}, conversion_key:{type:"string"} }, required:["value","conversion_key"] } } },
  { type:"function", function:{ name:"get_briefing", description:"Give a combined daily briefing: weather, to-do list, and today's routine checklist.",
    parameters:{ type:"object", properties:{} } } },
  { type:"function", function:{ name:"save_note", description:"Save a quick timestamped note to scratch memory, e.g. 'I parked on level 3'.",
    parameters:{ type:"object", properties:{ text:{type:"string"} }, required:["text"] } } },
  { type:"function", function:{ name:"read_notes", description:"Read back recent saved notes.",
    parameters:{ type:"object", properties:{} } } },
  { type:"function", function:{ name:"add_habit", description:"Add an item to the user's daily routine/habit checklist (resets each day).",
    parameters:{ type:"object", properties:{ name:{type:"string"} }, required:["name"] } } },
  { type:"function", function:{ name:"check_off_habit", description:"Mark a routine/habit item as done for today.",
    parameters:{ type:"object", properties:{ name:{type:"string"} }, required:["name"] } } },
  { type:"function", function:{ name:"read_habits", description:"Read back today's routine/habit checklist and completion status.",
    parameters:{ type:"object", properties:{} } } },
  { type:"function", function:{ name:"save_day_plan", description:"Save or update the user's plan for a specific day. If they're changing an existing plan mid-day, call read_day_plan first, merge in the change, then call this with the full updated plan.",
    parameters:{ type:"object", properties:{ date:{type:"string", description:"the date this plan is for, resolved to YYYY-MM-DD format based on the current date/time given (e.g. if they say 'tomorrow', compute tomorrow's actual date) — never pass the literal word 'today' or 'tomorrow'"}, plan:{type:"string", description:"the full plan text"} }, required:["date","plan"] } } },
  { type:"function", function:{ name:"read_day_plan", description:"Read back the saved plan for a specific day (defaults to today if no date given).",
    parameters:{ type:"object", properties:{ date:{type:"string", description:"the date to look up, resolved to YYYY-MM-DD format based on the current date/time given; omit entirely for today"} } } } },
  { type:"function", function:{ name:"write_document", description:"Write out a plan, list, or any longer piece of content into a visible side panel for the user to read, instead of only speaking it aloud. Use this whenever the user asks for a plan, itinerary, outline, or anything that should be written down rather than just spoken.",
    parameters:{ type:"object", properties:{ title:{type:"string", description:"short title for this document"}, content:{type:"string", description:"the full written content"} }, required:["title","content"] } } },
  { type:"function", function:{ name:"convert_currency", description:"Convert an amount from one currency to another, e.g. 100 USD to EUR.",
    parameters:{ type:"object", properties:{ amount:{type:"number"}, from_code:{type:"string", description:"3-letter currency code, e.g. USD"}, to_code:{type:"string", description:"3-letter currency code, e.g. EUR"} }, required:["amount","from_code","to_code"] } } },
  { type:"function", function:{ name:"define_word", description:"Look up the definition of a word.",
    parameters:{ type:"object", properties:{ word:{type:"string"} }, required:["word"] } } },
  { type:"function", function:{ name:"save_contact", description:"Save a short note about a person, e.g. name 'Mom' note 'birthday is the 12th'.",
    parameters:{ type:"object", properties:{ name:{type:"string"}, note:{type:"string"} }, required:["name","note"] } } },
  { type:"function", function:{ name:"read_contact", description:"Read back a saved note about a specific person by name.",
    parameters:{ type:"object", properties:{ name:{type:"string"} }, required:["name"] } } },
  { type:"function", function:{ name:"list_contacts", description:"List everyone currently saved with a note.",
    parameters:{ type:"object", properties:{} } } },
  ...REMINDER_TOOLS
];

const now = new Date();
const SYSTEM_PROMPT = `You are Jarvis, a concise personal assistant running in the user's Chrome browser. Address the user as "sir" occasionally and naturally (not every single sentence), in the style of a calm, unflappable British butler-type assistant. Current date/time: ${now.toString()}. Use open_app to open sites, get_weather for weather, get_prayer_times for Islamic prayer times, set_timer for countdown timers, play_music to search/open a song, look_at_screen to answer anything about what's currently on the user's screen, get_stock_price for stock questions, add_to_list/read_list/remove_from_list for the user's to-do list, get_news for headlines, calculate for math, convert_unit for unit conversions, convert_currency for currency, define_word for definitions, get_briefing for a combined daily summary, save_note/read_notes for quick scratch memory, add_habit/check_off_habit/read_habits for a daily routine checklist, save_contact/read_contact/list_contacts for short notes about people, save_day_plan to save or update the user's plan for a specific day (today, tomorrow, or a date — if they're changing it mid-day, read the current plan first then save the merged version), read_day_plan to read back a day's plan when asked "what's my plan," write_document whenever the user asks for a plan, list, itinerary, or anything that should be written down rather than just spoken (give a brief spoken summary alongside it), and set_reminder/list_reminders/cancel_reminder for scheduling (infer when_iso relative to the current date/time given). IMPORTANT: whenever the user tells you something worth remembering for later (a preference, a fact about their life, something they plan to do), proactively call save_note or add_to_list yourself without waiting to be asked to "remember" or "save" it — this is how you actually retain things between visits, since your conversation memory resets each time the page reloads but save_note/add_to_list/add_habit/save_contact persist permanently in the browser. For everything else, answer directly and briefly since replies are read aloud.`;

let conversation = [{ role: "system", content: SYSTEM_PROMPT }];

async function fetchGroq(apiKey, messages) {
  return fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
    body: JSON.stringify({ model: "llama-3.1-8b-instant", max_tokens: 600, tools: TOOLS, messages: messages })
  });
}

async function runTool(call) {
  const args = JSON.parse(call.function.arguments || "{}");
  if (call.function.name === "open_app") return openApp(args.app_name || "");
  if (call.function.name === "get_stock_price") return await getStockPrice(args.symbol_or_name || "");
  if (call.function.name === "get_weather") return await getWeather();
  if (call.function.name === "get_prayer_times") return await getPrayerTimes();
  if (call.function.name === "set_timer") return setTimer(args.minutes, args.label);
  if (call.function.name === "play_music") return playMusic(args.query || "");
  if (call.function.name === "look_at_screen") return await lookAtScreen(args.question || "");
  if (call.function.name === "add_to_list") return addToList(args.item || "");
  if (call.function.name === "read_list") return readList();
  if (call.function.name === "remove_from_list") return removeFromList(args.item || "");
  if (call.function.name === "get_news") return await getNews(args.topic);
  if (call.function.name === "calculate") return calculate(args.expression || "");
  if (call.function.name === "convert_unit") return convertUnit(args.value, args.conversion_key);
  if (call.function.name === "get_briefing") return await getDailyBriefing();
  if (call.function.name === "save_note") return saveNote(args.text || "");
  if (call.function.name === "read_notes") return readNotes();
  if (call.function.name === "add_habit") return addHabit(args.name || "");
  if (call.function.name === "check_off_habit") return checkOffHabit(args.name || "");
  if (call.function.name === "read_habits") return readHabits();
  if (call.function.name === "save_day_plan") return saveDayPlan(args.date, args.plan || "");
  if (call.function.name === "read_day_plan") return readDayPlan(args.date);
  if (call.function.name === "write_document") return writeDocument(args.title || "Untitled", args.content || "");
  if (call.function.name === "convert_currency") return await convertCurrency(args.amount, args.from_code, args.to_code);
  if (call.function.name === "define_word") return await defineWord(args.word || "");
  if (call.function.name === "save_contact") return saveContact(args.name || "", args.note || "");
  if (call.function.name === "read_contact") return readContact(args.name || "");
  if (call.function.name === "list_contacts") return listContacts();
  const reminderResult = await runReminderTool(call);
  if (reminderResult !== null) return reminderResult;
  return "Unknown action.";
}

async function callJarvis(userText) {
  const apiKey = getGroqKey();
  if (!apiKey) { const m = 'Please paste your free Groq API key above first.'; addMessage('Jarvis', m); speak(m); return; }

  conversation.push({ role: "user", content: userText });
  setStatus("Thinking...");

  try {
    let res = await fetchGroq(apiKey, conversation);
    let data = await res.json();
    if (!res.ok) {
      const m = `Sorry, I ran into an error: ${data.error ? data.error.message : res.statusText}`;
      addMessage('Jarvis', m); speak(m); setStatus(IDLE_TEXT_FALLBACK); return;
    }

    let message = data.choices[0].message;
    conversation.push(message);

    if (message.content && message.content.trim()) { addMessage('Jarvis', message.content.trim()); speak(message.content.trim()); }

    if (message.tool_calls && message.tool_calls.length) {
      for (const call of message.tool_calls) {
        const resultText = await runTool(call);
        addMessage('Jarvis', resultText);
        speak(resultText);
        conversation.push({ role: "tool", tool_call_id: call.id, content: resultText });
      }
      setStatus("Thinking...");
      res = await fetchGroq(apiKey, conversation);
      data = await res.json();
      if (res.ok) {
        message = data.choices[0].message;
        conversation.push(message);
        if (message.content && message.content.trim()) { addMessage('Jarvis', message.content.trim()); speak(message.content.trim()); }
      } else {
        const m = `Sorry, I hit an error following up on that: ${data.error ? data.error.message : res.statusText}`;
        addMessage('Jarvis', m); speak(m);
      }
    }
  } catch (e) {
    const m = `Sorry, sir, something went wrong: ${e.message}`;
    addMessage('Jarvis', m); speak(m);
  }

  setStatus(IDLE_TEXT_FALLBACK);
}

// ---------- Speech recognition ----------
let recognizing = false, recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  // listenDot element removed from UI; guarded below so nothing throws
  // statusText element removed from UI; setStatus() helper handles this safely now
  let micEnabled = false;
  let paused = false; // true while Jarvis is thinking or speaking, so it doesn't hear itself
  const IDLE_TEXT = `Say "Hey Jarvis" to give a command.`;

  // Prevents the common "recognition has already started" error, which
  // silently breaks the auto-restart loop if two starts overlap.
  function safeStart() {
    if (recognizing) { debugLog("safeStart: skipped, already recognizing"); return; }
    if (paused) { debugLog("safeStart: skipped, still paused"); return; }
    if (!micEnabled) { debugLog("safeStart: skipped, mic not enabled"); return; }
    try {
      recognition.start();
      debugLog("safeStart: recognition.start() called OK");
    } catch (e) {
      debugLog("safeStart: recognition.start() THREW: " + e.name + " — " + e.message);
    }
  }

  // More forgiving than requiring the exact phrase "hey jarvis" — accepts
  // "hey jarvis", "ok jarvis", "okay jarvis", or just "jarvis" anywhere in
  // what was said, and a couple of common speech-recognition mishears of
  // the name. This fixes having to repeat the wake word several times.
  const WAKE_PATTERN = /\b(hey|hi|ok|okay)?\s*(jarvis|jarvus|jaarvis|jarvic)\b/i;
  function extractCommand(transcript) {
    const match = transcript.match(WAKE_PATTERN);
    if (!match) return null;
    const idx = match.index + match[0].length;
    let rest = transcript.slice(idx).trim();
    rest = rest.replace(/^[,:\-]\s*/, '');
    return rest;
  }

  recognition.onstart = () => {
    recognizing = true;
    const dotEl1 = document.getElementById('listenDot'); if (dotEl1) { dotEl1.style.background = '#ff5b5b'; dotEl1.style.boxShadow = '0 0 8px #ff5b5b'; }
    setStatus("Listening...");
    debugLog("Mic active — listening for speech");
  };

  recognition.onend = () => {
    recognizing = false;
    const dotEl2 = document.getElementById('listenDot'); if (dotEl2) { dotEl2.style.background = 'var(--cyan)'; dotEl2.style.boxShadow = '0 0 8px var(--cyan)'; }
    debugLog("Mic cycle ended — restarting...");
    setTimeout(safeStart, 120);
  };

  recognition.onerror = (e) => {
    recognizing = false;
    debugLog("Mic error event: " + e.error);
    if (e.error === 'no-speech' || e.error === 'aborted') return; // normal, just restart
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setStatus("Mic permission blocked — check the site's permissions in Chrome (padlock icon in the address bar) and allow microphone access.");
      return;
    }
    setStatus(`Mic error: ${e.error} — retrying...`);
    setTimeout(safeStart, 800);
  };

  let followUpActive = false;
  let followUpTimeout = null;
  const FOLLOW_UP_WINDOW_MS = 7000;

  function startFollowUpWindow() {
    followUpActive = true;
    clearTimeout(followUpTimeout);
    followUpTimeout = setTimeout(() => { followUpActive = false; }, FOLLOW_UP_WINDOW_MS);
  }

  recognition.onresult = async (event) => {
    const t = event.results[0][0].transcript;
    debugLog("Heard: \"" + t + "\"");
    let command;

    if (followUpActive) {
      // Within a few seconds of the last response, skip the wake-word
      // requirement so follow-ups feel like a natural conversation.
      command = t.trim();
    } else {
      command = extractCommand(t);
      if (command === null) {
        // Wake word wasn't heard and we're not in a follow-up window — ignore.
        return;
      }
    }

    if (!command) {
      // They said just "Hey Jarvis" with nothing after it.
      addMessage('You', 'Hey Jarvis');
      addMessage('Jarvis', 'Yes, sir?');
      speak('Yes, sir?');
      startFollowUpWindow();
      return;
    }

    clearTimeout(followUpTimeout);
    followUpActive = false;
    addMessage('You', t);
    paused = true;
    setStatus("Thinking...");
    await callJarvis(command);
    paused = false;
    setStatus(IDLE_TEXT);
    safeStart();
    startFollowUpWindow();
  };

  function enableMic() {
    grantMicAndStart();
    const overlay = document.getElementById('enableOverlay');
    if (overlay) overlay.remove();
  }

  // getUserMedia's permission grant is remembered far more reliably by Chrome
  // than repeatedly calling recognition.start() cold, which was causing the
  // native "Allow microphone" bar to reappear on every restart. Ask once here,
  // then let the recognizer run freely afterward.
  function grantMicAndStart() {
    debugLog("Requesting microphone access...");
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then((stream) => {
        stream.getTracks().forEach(t => t.stop()); // we only needed the permission grant
        micEnabled = true;
        debugLog("Mic permission granted — starting recognizer");
        safeStart();
      })
      .catch((err) => {
        debugLog("Mic permission FAILED: " + err.name + " — " + err.message);
        setStatus("Mic permission was blocked — check the site's permissions (padlock icon in the address bar) and allow microphone access, then reload.");
      });
  }

  // Chrome requires a genuine click on the page itself before it will allow
  // speech synthesis to play (the mic's native "Allow" popup does NOT count
  // as this click — that's a separate browser-level permission). So we
  // always show one required tap here, which unlocks audio AND starts the
  // mic together, rather than relying on getUserMedia's prompt alone.
  const startOverlay = document.createElement('div');
  startOverlay.id = 'enableOverlay';
  startOverlay.style.cssText = 'position:fixed; inset:0; background:rgba(4,7,10,0.92); display:flex; align-items:center; justify-content:center; z-index:1000; color:var(--text); font-size:18px; letter-spacing:1px; cursor:pointer; text-align:center; padding:20px; font-family:"Rajdhani",sans-serif;';
  startOverlay.innerHTML = 'Tap anywhere to start JARVIS<br><span style="font-size:12px; color:var(--text-dim); letter-spacing:0.5px;">(you\'ll be asked to allow mic + pick a screen to share)</span>';
  startOverlay.addEventListener('click', () => {
    // Unlock speech synthesis with a near-silent utterance triggered by
    // this real click, so future automatic speak() calls are allowed.
    const unlock = new SpeechSynthesisUtterance(' ');
    unlock.volume = 0.01;
    window.speechSynthesis.speak(unlock);
    grantMicAndStart();
    requestScreenShare();
    maybeAnnounceTodayPlan();
    startOverlay.remove();
  });
  document.body.appendChild(startOverlay);

  setStatus(IDLE_TEXT);

  // Pause the mic while Jarvis is speaking so it doesn't transcribe itself,
  // then resume automatically once speech finishes. We wrap the existing
  // speak() (defined earlier, with mute-check and voice selection already
  // built in) rather than replacing it, so nothing gets silently lost.
  const baseSpeak = speak;
  speak = function(text) {
    paused = true;
    const ringWrap = document.querySelector('.ring-wrap');
    if (isMuted) { paused = false; safeStart(); return; }
    const u = new SpeechSynthesisUtterance(text);
    if (chosenVoice) u.voice = chosenVoice;
    u.rate = 1.08;
    u.pitch = 1.0;

    let resumed = false;
    function resumeListening(source) {
      if (resumed) { debugLog("resumeListening(" + source + "): already resumed, skipped"); return; }
      resumed = true;
      debugLog("resumeListening(" + source + "): resuming now");
      if (ringWrap) ringWrap.classList.remove('speaking');
      paused = false;
      safeStart();
    }

    u.onstart = () => { if (ringWrap) ringWrap.classList.add('speaking'); debugLog("TTS started speaking"); };
    u.onend = () => resumeListening('onend');
    u.onerror = (e) => resumeListening('onerror:' + e.error);
    window.speechSynthesis.speak(u);

    // Chrome's speechSynthesis onend event is known to sometimes never fire
    // (especially for short phrases), which would otherwise leave the mic
    // permanently paused with no way to recover. This fallback guarantees
    // listening resumes even if that happens — timed generously past the
    // text's estimated speaking length.
    const estimatedMs = Math.max(2000, text.length * 90);
    setTimeout(() => resumeListening('fallback-timer'), estimatedMs);
  };

  // Chrome throttles/pauses background tabs, so speech recognition can stop
  // reliably firing while you're on another tab. This won't make it keep
  // listening while backgrounded (that's a browser-level restriction we
  // can't override) — but it does automatically pick back up the instant
  // you return to this tab, rather than staying stuck.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && micEnabled) {
      safeStart();
    }
  });
} else {
  setStatus("Speech recognition isn't supported in this browser.");
}
</script>

</body>
</html>
